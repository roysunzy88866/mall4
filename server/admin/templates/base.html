<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RIDEMALL 后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand mb-0">RIDEMALL 后台</span>
  {% if session.get('admin') %}
  <div class="ms-auto">
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin.dashboard') }}">仪表盘</a>
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin.categories_page') }}">分类</a>
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin.products_page') }}">商品</a>
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin.banners_page') }}">推荐位</a>
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin.orders_page') }}">订单</a>
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin.logout') }}">退出</a>
  </div>
  {% endif %}
</nav>
<main class="container py-4">
  {% block body %}{% endblock %}
</main>
</body>
</html>
