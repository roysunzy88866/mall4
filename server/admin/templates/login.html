{% extends "base.html" %}
{% block login %}
<div class="card2" style="margin-top:8vh">
  <div style="display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:18px">
    <span style="width:26px;height:26px;border-radius:8px;background:var(--accent);display:inline-block"></span>
    RIDE<span style="color:var(--accent)">MALL</span> 管理后台
  </div>
  {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="mb-3">
      <label class="form-label">账号</label>
      <input class="form-control" name="username" autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">口令</label>
      <input class="form-control" type="password" name="password">
    </div>
    <button class="btn2 accent w-100" style="width:100%;padding:11px" type="submit">登录</button>
  </form>
</div>
{% endblock %}
